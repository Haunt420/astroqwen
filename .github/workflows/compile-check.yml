name: Compile check

on:
  # ── Manual trigger ─────────────────────────────────────────────────────────
  # Green "Run workflow" button appears in GitHub → Actions → Compile check
  workflow_dispatch:
    inputs:
      run_lint:
        description: 'Run lint in addition to compile'
        required: false
        default: 'false'
        type: boolean
      run_tests:
        description: 'Run unit tests in addition to compile'
        required: false
        default: 'false'
        type: boolean

  # ── Automatic triggers ─────────────────────────────────────────────────────
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/AndroidManifest.xml'
      - 'gradle/**'
      - 'gradle.properties'
  pull_request:
    branches:
      - main
      - develop

# Cancel any in-progress run for the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Source ───────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Java ─────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Android SDK ──────────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      # ── 4. Gradle wrapper ───────────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x gradlew

      # gradle-wrapper.jar is a binary that should be committed.
      # If it is missing (e.g. gitignored by accident), regenerate it here
      # using the system Gradle that ships on ubuntu-latest.
      - name: Regenerate gradle-wrapper.jar if absent
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "⚠️  gradle-wrapper.jar missing — regenerating via system gradle"
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin
            echo "✅  gradle-wrapper.jar regenerated"
          else
            echo "✅  gradle-wrapper.jar present"
          fi

      # ── 5. Cache Gradle distributions ──────────────────────────────────────
      - name: Cache Gradle distributions
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-8.11.1
          restore-keys: gradle-dist-

      # ── 6. Compile ──────────────────────────────────────────────────────────
      - name: Compile debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m"

      # ── 7. Optional lint ────────────────────────────────────────────────────
      - name: Lint
        if: ${{ github.event.inputs.run_lint == 'true' }}
        run: |
          ./gradlew lintDebug \
            --no-daemon \
            --continue

      - name: Upload lint report
        if: ${{ github.event.inputs.run_lint == 'true' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14

      # ── 8. Optional unit tests ──────────────────────────────────────────────
      - name: Unit tests
        if: ${{ github.event.inputs.run_tests == 'true' }}
        run: |
          ./gradlew testDebugUnitTest \
            --no-daemon \
            --continue

      - name: Upload test report
        if: ${{ github.event.inputs.run_tests == 'true' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      # ── 9. Upload APK ───────────────────────────────────────────────────────
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stellarpath-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      # ── 10. Build summary ───────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          echo "## StellarPath compile result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Run | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            APK_SIZE=$(du -sh app/build/outputs/apk/debug/app-debug.apk | cut -f1)
            echo "| APK size | $APK_SIZE |" >> $GITHUB_STEP_SUMMARY
            echo "| Status | ✅ Build passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Status | ❌ APK not produced |" >> $GITHUB_STEP_SUMMARY
          fi
