name: Compile check

on:
  # Manual trigger — button appears on whichever branch you select in the UI.
  # IMPORTANT: if your default branch is "master" not "main", select the correct
  # branch in the dropdown before clicking Run workflow.
  workflow_dispatch:
    inputs:
      run_lint:
        description: 'Run lint'
        required: false
        default: 'false'
        type: boolean
      run_tests:
        description: 'Run unit tests'
        required: false
        default: 'false'
        type: boolean
      refresh_deps:
        description: 'Force re-download all dependencies (busts plugin cache)'
        required: false
        default: 'false'
        type: boolean

  # Auto-trigger on every push to any branch — no paths filter.
  # Paths filters are removed because they can silently skip root-level .kts
  # changes depending on how GitHub expands the glob.
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Diagnostic — print exactly what we are building ─────────────────
      # If this step shows the old KSP version, the file was not pushed to
      # the branch selected when the workflow was triggered.
      - name: Show build identity
        run: |
          echo "::group::Git info"
          echo "Branch : ${{ github.ref_name }}"
          echo "SHA    : ${{ github.sha }}"
          echo "Trigger: ${{ github.event_name }}"
          echo "::endgroup::"

          echo "::group::build.gradle.kts (root)"
          cat build.gradle.kts
          echo "::endgroup::"

          echo "::group::settings.gradle.kts"
          cat settings.gradle.kts
          echo "::endgroup::"

          echo "::group::gradle-wrapper.properties"
          cat gradle/wrapper/gradle-wrapper.properties
          echo "::endgroup::"

      # ── 3. Java ────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 4. Android SDK ─────────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      # ── 5. Gradle wrapper ──────────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Regenerate gradle-wrapper.jar if absent
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing — regenerating"
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          fi

      # ── 6. Cache Gradle distributions ──────────────────────────────────────
      - name: Cache Gradle distributions
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-8.11.1
          restore-keys: gradle-dist-

      # ── 7. Compile ─────────────────────────────────────────────────────────
      - name: Compile debug APK
        run: |
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.refresh_deps }}" = "true" ]; then
            EXTRA_FLAGS="--refresh-dependencies"
          fi

          ./gradlew assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --warning-mode all \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m" \
            $EXTRA_FLAGS

      # ── 8. Optional lint ───────────────────────────────────────────────────
      - name: Lint
        if: ${{ github.event.inputs.run_lint == 'true' }}
        run: ./gradlew lintDebug --no-daemon --no-configuration-cache --continue

      - name: Upload lint report
        if: ${{ github.event.inputs.run_lint == 'true' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14

      # ── 9. Optional unit tests ─────────────────────────────────────────────
      - name: Unit tests
        if: ${{ github.event.inputs.run_tests == 'true' }}
        run: ./gradlew testDebugUnitTest --no-daemon --no-configuration-cache --continue

      - name: Upload test report
        if: ${{ github.event.inputs.run_tests == 'true' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      # ── 10. Upload APK ─────────────────────────────────────────────────────
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stellarpath-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      # ── 11. Job summary ────────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          echo "## StellarPath compile result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Run    | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            APK_SIZE=$(du -sh app/build/outputs/apk/debug/app-debug.apk | cut -f1)
            echo "| APK size | $APK_SIZE |" >> $GITHUB_STEP_SUMMARY
            echo "| Status | ✅ passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Status | ❌ APK not produced |" >> $GITHUB_STEP_SUMMARY
          fi
